<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi • ChatNEXA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b12;color:#f4f6ff;font:16px system-ui;display:grid;place-items:center}.card{width:min(420px,92vw);padding:32px;background:#121722;border:1px solid #293146;border-radius:26px;text-align:center}.logo{font-size:28px;font-weight:800}.logo b{color:#6fa8ff}h1{margin:28px 0 8px}.sub{color:#9ea9bd;line-height:1.5}input,button{width:100%;padding:14px;border-radius:14px;font:inherit}input{background:#0b0f17;border:1px solid #303a50;color:white;margin-top:18px}button{border:0;background:#3978ee;color:white;font-weight:700;margin-top:10px;cursor:pointer}.alt{background:transparent;color:#aeb8ca}.msg{min-height:24px;color:#ff9b9b;margin:12px 0 0}[hidden]{display:none!important}</style></head><body><main class="card"><div class="logo">✦ Chat<b>NEXA</b></div><h1 id="title">Bentornato ✨</h1><p class="sub" id="sub">Inserisci la tua email e ti invieremo un codice di accesso.</p><form id="form"><input id="email" type="email" placeholder="La tua email" autocomplete="username webauthn" required><div id="codeBox" hidden><input id="code" inputmode="numeric" maxlength="6" placeholder="Codice a 6 cifre" autocomplete="one-time-code"></div><button id="submit">Continua</button><button id="back" type="button" class="alt" hidden>Usa un'altra email</button></form><p class="msg" id="msg"></p></main><script>
const A=window.hatchable?.auth,email=document.getElementById('email'),code=document.getElementById('code'),form=document.getElementById('form'),submit=document.getElementById('submit'),msg=document.getElementById('msg'),box=document.getElementById('codeBox'),back=document.getElementById('back'),sub=document.getElementById('sub');let step='email';
function next(){const n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.startsWith('/')&&!n.startsWith('//')?n:'/')}
A?.getSession().then(s=>{if(s?.user)next()});
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';submit.disabled=true;try{if(step==='email'){await A.startLogin({email:email.value.trim()});step='code';email.hidden=true;box.hidden=false;back.hidden=false;submit.textContent='Accedi';sub.textContent='Inserisci il codice che abbiamo inviato alla tua email.';code.focus()}else{const r=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(r?.user)next();else throw Error('Codice non valido')}}catch(err){msg.textContent=err.message||'Qualcosa non ha funzionato.'}finally{submit.disabled=false}};
back.onclick=()=>{step='email';email.hidden=false;box.hidden=true;back.hidden=true;submit.textContent='Continua';sub.textContent='Inserisci la tua email e ti invieremo un codice di accesso.';email.focus()};
</script></body></html>
